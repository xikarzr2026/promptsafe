<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="PromptSafe — scrub secrets before you paste">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eef2ff"/>
      <stop offset="0.55" stop-color="#f5f3ff"/>
      <stop offset="1" stop-color="#ffffff"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="320" fill="url(#bg)"/>
  <rect x="0" y="0" width="1200" height="6" fill="url(#brand)"/>

  <!-- shield -->
  <g transform="translate(88 92)">
    <path d="M60 0 6 24v45c0 36 24 66 54 76 30-10 54-40 54-76V24z" fill="url(#brand)"/>
    <path d="M34 68l15 15 31-36" fill="none" stroke="#ffffff" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <text x="240" y="152" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Inter, Helvetica, Arial, sans-serif"
        font-size="86" font-weight="700" letter-spacing="-2.5" fill="#0f172a">PromptSafe</text>

  <!-- version pill -->
  <g>
    <rect x="742" y="96" width="126" height="48" rx="24" fill="url(#brand)"/>
    <text x="805" y="129" text-anchor="middle"
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Inter, Helvetica, Arial, sans-serif"
          font-size="25" font-weight="700" letter-spacing="0.5" fill="#ffffff">v1.2</text>
  </g>

  <text x="244" y="196" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Inter, Helvetica, Arial, sans-serif"
        font-size="25" font-weight="400" fill="#475569">Scrub secrets before you paste.</text>

  <rect x="240" y="222" width="470" height="3" rx="1.5" fill="url(#fade)"/>

  <text x="244" y="262" font-family="ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', monospace"
        font-size="19" fill="#6366f1">100% client-side · no database · nothing seen · nothing saved</text>
</svg>
